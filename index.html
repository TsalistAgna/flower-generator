<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>🌸 Discover Your Unique Bloom! 🌸</h1>
            <p>Find out which bloom represents you best!</p>

            <h2>Enter Your Name 🌷</h2>
            <input type="text" id="nameInput" placeholder="Your name..." required>

            <button onclick="checkName()">Start</button>
        </div>
    </div>

    <script>
        function checkName() {
            let name = document.getElementById("nameInput").value.trim().toLowerCase();

            if (!name) {
                alert("Please enter your name!");
                return;
            }

            // Cek jika nama spesial (bisa ditambah lebih banyak nama spesial)
            if (name === "sayang" || name.includes("270523")) {
                window.location.href = `result.html?name=${encodeURIComponent(name)}&special=true`;
            } else {
                window.location.href = `quiz.html?name=${encodeURIComponent(name)}`;
            }
        }
    </script>
</body>
</html>
